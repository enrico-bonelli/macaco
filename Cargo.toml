[package]
name = "macaco"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Editor di testo leggero e minimale (GTK 4)"

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
libc = "0.2"
pangocairo = "0.22.9"
regex = "1.13.1"
serde_json = "1"
similar = { version = "3.2.0", default-features = false, features = ["std", "text"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Release optimisations with the debug script hook enabled (for testing).
[profile.perf]
inherits = "release"
debug-assertions = true
strip = false
